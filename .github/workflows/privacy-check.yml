name: privacy-check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  no-private-leakage:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install ripgrep
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ripgrep

      - name: Full-tree privacy gate
        env:
          # Optional extra PCRE alternation from repo secret
          PRIVACY_EXTRA_PATTERN: ${{ secrets.PRIVACY_EXTRA_PATTERN }}
        run: bash scripts/check_no_private_leakage.sh

      - name: Marketplace layout + skills.manifest sanity
        run: |
          set -euo pipefail
          test -f .cursor-plugin/marketplace.json
          test -f plugins/rayleigh-coding/.cursor-plugin/plugin.json
          test -f plugins/rayleigh-coding/skills.manifest
          python3 scripts/validate_marketplace.py

  release-gates:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install ripgrep + pytest
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ripgrep
          python3 -m pip install --user pytest

      - name: Executable bits on skill scripts
        run: bash scripts/check_executable_scripts.sh

      - name: Skill frontmatter validation
        run: python3 scripts/validate_skills.py

      - name: Unit tests (code-review)
        run: python3 -m pytest plugins/rayleigh-coding/skills/code-review/tests -q

      - name: History hygiene scan
        run: bash scripts/check_history_hygiene.sh
