name: privacy-check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  no-private-leakage:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install ripgrep
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ripgrep

      - name: Refuse private / personal leakage
        run: bash scripts/check_no_private_leakage.sh

      - name: Marketplace layout sanity
        run: |
          set -euo pipefail
          test -f .cursor-plugin/marketplace.json
          test -f plugins/rayleigh-coding/.cursor-plugin/plugin.json
          test -d plugins/rayleigh-coding/skills
          python3 - <<'PY'
          import json
          from pathlib import Path
          market = json.loads(Path(".cursor-plugin/marketplace.json").read_text())
          assert market["name"] == "rayleigh-coding"
          plugins = market["plugins"]
          assert any(p.get("name") == "rayleigh-coding" for p in plugins)
          for p in plugins:
              src = Path(p["source"])
              assert src.is_dir(), src
              assert (src / ".cursor-plugin" / "plugin.json").is_file(), src
          plugin = json.loads(Path("plugins/rayleigh-coding/.cursor-plugin/plugin.json").read_text())
          assert plugin["name"] == "rayleigh-coding"
          print("marketplace layout ok")
          PY
